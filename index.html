<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Tracker</title>
    <script>
      // Polyfill for crypto.subtle on non-secure contexts (HTTP on non-localhost)
      if (!crypto.subtle) {
        // Simple fallback hash implementation for non-cryptographic purposes
        crypto.subtle = {
          digest: async function (algorithm, data) {
            const arr = new Uint8Array(data);
            let h = 0;
            for (let i = 0; i < arr.length; i++) {
              h = ((h << 5) - h + arr[i]) | 0;
            }
            // Generate a 64-byte buffer (SHA-512 size) from the simple hash
            const result = new ArrayBuffer(64);
            const view = new DataView(result);
            for (let i = 0; i < 16; i++) {
              view.setUint32(i * 4, h ^ (h >>> i), false);
              h = ((h << 5) - h + i) | 0;
            }
            return result;
          },
        };
      }
    </script>
    <script>
      (function () {
        function resetTrackerState() {
          try {
            window.localStorage.clear();
          } catch (error) {
            console.error(
              'Failed to clear localStorage during tracker reset:',
              error,
            );
          } finally {
            window.location.reload();
          }
        }

        function showEmergencyReset() {
          document.body.classList.remove('tlt-app-mounted');
          document.body.classList.add('tlt-runtime-error');
        }

        window.__TLT_RESET_TRACKER_STATE__ = resetTrackerState;
        window.addEventListener('error', showEmergencyReset);
        window.addEventListener('unhandledrejection', showEmergencyReset);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #1a1a1a;
        color: #f0f0f0;
      }

      #tlt-shell-header {
        background: #2a2a2a;
        padding: 1rem 2rem;
        border-bottom: 2px solid #404040;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      #tlt-shell-header h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }

      .tlt-shell-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #tlt-shell-header .tlt-shell-brand h1 {
        margin-left: 0.875rem;
      }

      .tlt-shell-logo {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.375rem;
        object-fit: cover;
        display: block;
        transform: scale(2.3);
        transform-origin: center;
      }

      .tlt-shell-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .tlt-shell-pack-selector {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .tlt-shell-pack-selector label {
        font-size: 0.875rem;
        color: #9ca3af;
      }

      .tlt-shell-pack-selector select {
        background: #2a2a2a;
        color: #f0f0f0;
        border: 1px solid #404040;
        padding: 0.5rem;
        border-radius: 0.25rem;
      }

      #tlt-shell-reset {
        cursor: pointer;
        border: 1px solid #fca5a5;
        background: #7f1d1d;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 700;
      }

      #tlt-shell-reset:hover {
        background: #991b1b;
      }

      #tlt-shell-loading {
        min-height: calc(100vh - 6rem);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.875rem;
        padding: 1rem 2rem;
        color: #d1d5db;
      }

      .tlt-loader {
        width: 5.5rem;
        height: 5.5rem;
        position: relative;
        display: inline-block;
        --tri-size: 2.2rem;
        --tri-height: calc(var(--tri-size) * 0.8660254);
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25));
      }

      .tlt-loader .triforce {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--tri-size) * 2);
        height: calc(var(--tri-height) * 2);
        transform: translate(-50%, -50%);
      }

      .tlt-loader .triforce .tri {
        position: absolute;
        width: var(--tri-size);
        height: var(--tri-height);
        background: linear-gradient(180deg, #f9e27f 0%, #d5b22b 100%);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        opacity: 0.12;
        transform-origin: center;
        animation: tlt-tri 1.2s ease-in-out infinite;
      }

      .tlt-loader .triforce .tri-a {
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        animation-delay: 0s;
      }

      .tlt-loader .triforce .tri-b {
        left: 0;
        top: var(--tri-height);
        animation-delay: 0.12s;
      }

      .tlt-loader .triforce .tri-c {
        right: 0;
        top: var(--tri-height);
        animation-delay: 0.24s;
      }

      .tlt-loader .rupee {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1.2rem;
        height: 1.95rem;
        background: linear-gradient(180deg, #b6ffe9 0%, #4ce7c5 40%, #0e8f72 100%);
        clip-path: polygon(
          50% 0%,
          100% 30%,
          100% 70%,
          50% 100%,
          0% 70%,
          0% 30%
        );
        transform: translate(-50%, -50%);
        animation: tlt-orbit 1.2s linear infinite;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.24) inset,
          0 0 0 1px rgba(6, 74, 60, 0.7);
        filter: drop-shadow(0 0 5px rgba(70, 255, 221, 0.45));
      }

      .tlt-loader .rupee::before,
      .tlt-loader .rupee::after {
        content: '';
        position: absolute;
        inset: 0;
        clip-path: inherit;
      }

      .tlt-loader .rupee::before {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.28) 0%,
          rgba(255, 255, 255, 0) 52%
        );
      }

      .tlt-loader .rupee::after {
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0.08) 38%,
          rgba(8, 81, 65, 0.16) 72%,
          rgba(8, 81, 65, 0.4) 100%
        );
      }

      .tlt-loader-text {
        font-size: 1rem;
        letter-spacing: 0.02em;
      }

      @keyframes tlt-tri {
        0%,
        20% {
          opacity: 0.12;
        }

        35% {
          opacity: 1;
        }

        60% {
          opacity: 0.65;
        }

        100% {
          opacity: 0.12;
        }
      }

      @keyframes tlt-orbit {
        0% {
          transform: translate(-50%, -50%) rotate(0deg) translateY(-2.05rem)
            rotate(0deg);
          opacity: 0.9;
        }

        50% {
          opacity: 0.45;
        }

        100% {
          transform: translate(-50%, -50%) rotate(360deg) translateY(-2.05rem)
            rotate(-360deg);
          opacity: 0.9;
        }
      }

      @media (max-width: 700px) {
        #tlt-shell-header {
          padding: 1rem;
          flex-direction: column;
          align-items: flex-start;
        }

        .tlt-shell-actions {
          width: 100%;
        }

        .tlt-shell-pack-selector {
          width: 100%;
        }

        .tlt-shell-pack-selector select {
          flex: 1;
          min-width: 0;
        }
      }

      body.tlt-app-mounted #tlt-shell-header {
        display: none;
      }

      body.tlt-app-mounted #tlt-shell-loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tlt-shell-header">
      <div class="tlt-shell-brand">
        <img
          src="/images/logo_last_tracker.png"
          alt="The Last Tracker logo"
          class="tlt-shell-logo"
        />
        <h1>The Last Tracker</h1>
      </div>
      <div class="tlt-shell-actions">
        <div class="tlt-shell-pack-selector">
          <label for="tlt-shell-pack-select">Tracker Pack:</label>
          <select id="tlt-shell-pack-select" disabled>
            <option>OoTMM</option>
          </select>
        </div>
        <button
          id="tlt-shell-reset"
          type="button"
          onclick="window.__TLT_RESET_TRACKER_STATE__()"
        >
          RESET TRACKER STATE
        </button>
      </div>
    </div>
    <div id="tlt-shell-loading" aria-live="polite">
      <div class="tlt-loader" aria-label="Loading tracker" role="status">
        <span class="triforce" aria-hidden="true">
          <span class="tri tri-a"></span>
          <span class="tri tri-b"></span>
          <span class="tri tri-c"></span>
        </span>
        <span class="rupee"></span>
      </div>
      <div class="tlt-loader-text">Loading tracker...</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
