<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Tracker</title>
    <script>
      // Polyfill for crypto.subtle on non-secure contexts (HTTP on non-localhost)
      if (!crypto.subtle) {
        // Simple fallback hash implementation for non-cryptographic purposes
        crypto.subtle = {
          digest: async function (algorithm, data) {
            const arr = new Uint8Array(data);
            let h = 0;
            for (let i = 0; i < arr.length; i++) {
              h = ((h << 5) - h + arr[i]) | 0;
            }
            // Generate a 64-byte buffer (SHA-512 size) from the simple hash
            const result = new ArrayBuffer(64);
            const view = new DataView(result);
            for (let i = 0; i < 16; i++) {
              view.setUint32(i * 4, h ^ (h >>> i), false);
              h = ((h << 5) - h + i) | 0;
            }
            return result;
          },
        };
      }
    </script>
    <script>
      (function () {
        function resetTrackerState() {
          try {
            window.localStorage.clear();
          } catch (error) {
            console.error(
              'Failed to clear localStorage during tracker reset:',
              error,
            );
          } finally {
            window.location.reload();
          }
        }

        function showEmergencyReset() {
          document.body.classList.remove('tlt-app-mounted');
          document.body.classList.add('tlt-runtime-error');
        }

        window.__TLT_RESET_TRACKER_STATE__ = resetTrackerState;
        window.addEventListener('error', showEmergencyReset);
        window.addEventListener('unhandledrejection', showEmergencyReset);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #1a1a1a;
        color: #f0f0f0;
      }

      #tlt-shell-header {
        background: #2a2a2a;
        padding: 1rem 2rem;
        border-bottom: 2px solid #404040;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      #tlt-shell-header h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }

      .tlt-shell-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #tlt-shell-header .tlt-shell-brand h1 {
        margin-left: 0.875rem;
      }

      .tlt-shell-logo {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.375rem;
        object-fit: cover;
        display: block;
        transform: scale(2.3);
        transform-origin: center;
      }

      .tlt-shell-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .tlt-shell-pack-selector {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .tlt-shell-pack-selector label {
        font-size: 0.875rem;
        color: #9ca3af;
      }

      .tlt-shell-pack-selector select {
        background: #2a2a2a;
        color: #f0f0f0;
        border: 1px solid #404040;
        padding: 0.5rem;
        border-radius: 0.25rem;
      }

      #tlt-shell-reset {
        cursor: pointer;
        border: 1px solid #fca5a5;
        background: #7f1d1d;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 700;
      }

      #tlt-shell-reset:hover {
        background: #991b1b;
      }

      #tlt-shell-loading {
        min-height: calc(100vh - 6rem);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.875rem;
        padding: 1rem 2rem;
        color: #d1d5db;
      }

      .tlt-loader {
        width: 5.5rem;
        height: 5.5rem;
        position: relative;
        display: inline-block;
        --tri-size: 2.2rem;
        --tri-height: calc(var(--tri-size) * 0.8660254);
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25));
      }

      .tlt-loader .triforce {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--tri-size) * 2);
        height: calc(var(--tri-height) * 2);
        transform: translate(-50%, -50%);
      }

      .tlt-loader .triforce .tri {
        position: absolute;
        width: var(--tri-size);
        height: var(--tri-height);
        background: linear-gradient(180deg, #f9e27f 0%, #d5b22b 100%);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        opacity: 0.12;
        transform-origin: center;
        animation: tlt-tri 1.2s ease-in-out infinite;
      }

      .tlt-loader .triforce .tri-a {
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        animation-delay: 0s;
      }

      .tlt-loader .triforce .tri-b {
        left: 0;
        top: var(--tri-height);
        animation-delay: 0.12s;
      }

      .tlt-loader .triforce .tri-c {
        right: 0;
        top: var(--tri-height);
        animation-delay: 0.24s;
      }

      .tlt-loader .fairy {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3.2rem;
        height: 3.2rem;
        transform: translate(-50%, -50%);
        animation: tlt-fairy-path 1.95s linear infinite;
        pointer-events: none;
      }

      .tlt-loader .fairy .fairy-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 1.95rem;
        height: 1.95rem;
        border-radius: 999px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(201, 242, 255, 0.56) 32%,
          rgba(119, 202, 255, 0.32) 55%,
          rgba(38, 146, 255, 0.04) 100%
        );
        box-shadow:
          0 0 14px rgba(151, 224, 255, 0.95),
          0 0 26px rgba(63, 176, 255, 0.72);
        filter: blur(0.03rem);
        animation: tlt-fairy-glow 0.34s ease-in-out infinite;
      }

      .tlt-loader .fairy .fairy-sprite {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1.75rem;
        height: 1.5rem;
        transform: translate(-50%, -50%);
        background: center / contain no-repeat url('/images/Fairy.png');
        filter: hue-rotate(155deg) saturate(1.6) brightness(1.14)
          drop-shadow(0 0 4px rgba(186, 237, 255, 0.95))
          drop-shadow(0 0 10px rgba(84, 191, 255, 0.9));
        animation: tlt-fairy-hover 0.2s ease-in-out infinite alternate;
      }

      .tlt-loader .fairy .fairy-spark {
        position: absolute;
        width: 0.14rem;
        height: 0.14rem;
        border-radius: 999px;
        background: #e8f9ff;
        box-shadow:
          0 0 4px rgba(212, 243, 255, 1),
          0 0 10px rgba(120, 206, 255, 0.72);
      }

      .tlt-loader .fairy .fairy-spark-a {
        top: 0.18rem;
        right: 0.62rem;
        animation: tlt-fairy-spark-a 0.92s linear infinite;
      }

      .tlt-loader .fairy .fairy-spark-b {
        bottom: 0.24rem;
        left: 0.44rem;
        animation: tlt-fairy-spark-b 1.08s linear infinite;
      }

      .tlt-loader-text {
        font-size: 1rem;
        letter-spacing: 0.02em;
      }

      @keyframes tlt-tri {
        0%,
        20% {
          opacity: 0.12;
        }

        35% {
          opacity: 1;
        }

        60% {
          opacity: 0.65;
        }

        100% {
          opacity: 0.12;
        }
      }

      @keyframes tlt-fairy-path {
        0% {
          transform: translate(-50%, -50%) translate(-1.98rem, -0.35rem)
            scale(0.96);
        }

        10% {
          transform: translate(-50%, -50%) translate(-1.16rem, -1.72rem)
            scale(0.94);
        }

        19% {
          transform: translate(-50%, -50%) translate(0.44rem, -2.1rem)
            scale(0.99);
        }

        30% {
          transform: translate(-50%, -50%) translate(1.68rem, -1.22rem)
            scale(0.95);
        }

        41% {
          transform: translate(-50%, -50%) translate(2.08rem, 0.32rem)
            scale(0.98);
        }

        52% {
          transform: translate(-50%, -50%) translate(1.18rem, 1.82rem)
            scale(0.97);
        }

        64% {
          transform: translate(-50%, -50%) translate(-0.26rem, 2.08rem)
            scale(0.99);
        }

        76% {
          transform: translate(-50%, -50%) translate(-1.6rem, 1.42rem)
            scale(0.93);
        }

        88% {
          transform: translate(-50%, -50%) translate(-2.18rem, 0.34rem)
            scale(0.96);
        }

        100% {
          transform: translate(-50%, -50%) translate(-1.98rem, -0.35rem)
            scale(0.96);
        }
      }

      @keyframes tlt-fairy-glow {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.88);
          opacity: 0.68;
        }

        50% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 0.97;
        }
      }

      @keyframes tlt-fairy-hover {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(-7deg) translateY(0.05rem)
            scale(0.98);
        }

        50% {
          transform: translate(-50%, -50%) rotate(6deg) translateY(-0.06rem)
            scale(1.03);
        }
      }

      @keyframes tlt-fairy-spark-a {
        0% {
          transform: translate(0, 0) scale(0.5);
          opacity: 0;
        }

        35% {
          transform: translate(-0.44rem, -0.26rem) scale(1);
          opacity: 0.95;
        }

        100% {
          transform: translate(-0.94rem, -0.62rem) scale(0.35);
          opacity: 0;
        }
      }

      @keyframes tlt-fairy-spark-b {
        0% {
          transform: translate(0, 0) scale(0.45);
          opacity: 0;
        }

        45% {
          transform: translate(0.34rem, 0.28rem) scale(0.9);
          opacity: 0.84;
        }

        100% {
          transform: translate(0.88rem, 0.64rem) scale(0.3);
          opacity: 0;
        }
      }

      @media (max-width: 700px) {
        #tlt-shell-header {
          padding: 1rem;
          flex-direction: column;
          align-items: flex-start;
        }

        .tlt-shell-actions {
          width: 100%;
        }

        .tlt-shell-pack-selector {
          width: 100%;
        }

        .tlt-shell-pack-selector select {
          flex: 1;
          min-width: 0;
        }
      }

      body.tlt-app-mounted #tlt-shell-header {
        display: none;
      }

      body.tlt-app-mounted #tlt-shell-loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tlt-shell-header">
      <div class="tlt-shell-brand">
        <img
          src="/images/logo_last_tracker.png"
          alt="The Last Tracker logo"
          class="tlt-shell-logo"
        />
        <h1>The Last Tracker</h1>
      </div>
      <div class="tlt-shell-actions">
        <div class="tlt-shell-pack-selector">
          <label for="tlt-shell-pack-select">Tracker Pack:</label>
          <select id="tlt-shell-pack-select" disabled>
            <option>OoTMM</option>
          </select>
        </div>
        <button
          id="tlt-shell-reset"
          type="button"
          onclick="window.__TLT_RESET_TRACKER_STATE__()"
        >
          RESET TRACKER STATE
        </button>
      </div>
    </div>
    <div id="tlt-shell-loading" aria-live="polite">
      <div class="tlt-loader" aria-label="Loading tracker" role="status">
        <span class="triforce" aria-hidden="true">
          <span class="tri tri-a"></span>
          <span class="tri tri-b"></span>
          <span class="tri tri-c"></span>
        </span>
        <span class="fairy" aria-hidden="true">
          <span class="fairy-glow"></span>
          <span class="fairy-sprite"></span>
          <span class="fairy-spark fairy-spark-a"></span>
          <span class="fairy-spark fairy-spark-b"></span>
        </span>
      </div>
      <div class="tlt-loader-text">Loading tracker...</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
