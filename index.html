<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Tracker</title>
    <script>
      // Polyfill for crypto.subtle on non-secure contexts (HTTP on non-localhost)
      if (!crypto.subtle) {
        // Simple fallback hash implementation for non-cryptographic purposes
        crypto.subtle = {
          digest: async function (algorithm, data) {
            const arr = new Uint8Array(data);
            let h = 0;
            for (let i = 0; i < arr.length; i++) {
              h = ((h << 5) - h + arr[i]) | 0;
            }
            // Generate a 64-byte buffer (SHA-512 size) from the simple hash
            const result = new ArrayBuffer(64);
            const view = new DataView(result);
            for (let i = 0; i < 16; i++) {
              view.setUint32(i * 4, h ^ (h >>> i), false);
              h = ((h << 5) - h + i) | 0;
            }
            return result;
          },
        };
      }
    </script>
    <script>
      (function () {
        function resetTrackerState() {
          try {
            window.localStorage.clear();
          } catch (error) {
            console.error(
              'Failed to clear localStorage during tracker reset:',
              error,
            );
          } finally {
            window.location.reload();
          }
        }

        function showEmergencyReset() {
          document.body.classList.remove('tlt-app-mounted');
          document.body.classList.add('tlt-runtime-error');
        }

        window.__TLT_RESET_TRACKER_STATE__ = resetTrackerState;
        window.addEventListener('error', showEmergencyReset);
        window.addEventListener('unhandledrejection', showEmergencyReset);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #1a1a1a;
        color: #f0f0f0;
      }

      #tlt-shell-header {
        background: #2a2a2a;
        padding: 1rem 2rem;
        border-bottom: 2px solid #404040;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      #tlt-shell-header h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }

      .tlt-shell-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #tlt-shell-header .tlt-shell-brand h1 {
        margin-left: 0.875rem;
      }

      .tlt-shell-logo {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.375rem;
        object-fit: cover;
        display: block;
        transform: scale(2.3);
        transform-origin: center;
      }

      .tlt-shell-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .tlt-shell-pack-selector {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .tlt-shell-pack-selector label {
        font-size: 0.875rem;
        color: #9ca3af;
      }

      .tlt-shell-pack-selector select {
        background: #2a2a2a;
        color: #f0f0f0;
        border: 1px solid #404040;
        padding: 0.5rem;
        border-radius: 0.25rem;
      }

      #tlt-shell-reset {
        cursor: pointer;
        border: 1px solid #fca5a5;
        background: #7f1d1d;
        color: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 700;
      }

      #tlt-shell-reset:hover {
        background: #991b1b;
      }

      @media (max-width: 700px) {
        #tlt-shell-header {
          padding: 1rem;
          flex-direction: column;
          align-items: flex-start;
        }

        .tlt-shell-actions {
          width: 100%;
        }

        .tlt-shell-pack-selector {
          width: 100%;
        }

        .tlt-shell-pack-selector select {
          flex: 1;
          min-width: 0;
        }
      }

      body.tlt-app-mounted #tlt-shell-header {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tlt-shell-header">
      <div class="tlt-shell-brand">
        <img
          src="/images/logo_last_tracker.png"
          alt="The Last Tracker logo"
          class="tlt-shell-logo"
        />
        <h1>The Last Tracker</h1>
      </div>
      <div class="tlt-shell-actions">
        <div class="tlt-shell-pack-selector">
          <label for="tlt-shell-pack-select">Tracker Pack:</label>
          <select id="tlt-shell-pack-select" disabled>
            <option>OoTMM</option>
          </select>
        </div>
        <button
          id="tlt-shell-reset"
          type="button"
          onclick="window.__TLT_RESET_TRACKER_STATE__()"
        >
          RESET TRACKER STATE
        </button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
