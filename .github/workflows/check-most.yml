name: check-most

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  check-most:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OOTMM_COMMIT: 4f79debce328c6d2a78c9e66d64448e2298baa7f

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Checkout OoTMM
        run: |
          git clone --filter=blob:none https://github.com/OoTMM/OoTMM.git OoTMM
          git -C OoTMM checkout "$OOTMM_COMMIT"

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Install OoTMM dependencies
        working-directory: OoTMM
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build OoTMM core
        working-directory: OoTMM
        run: pnpm --filter @ootmm/core build

      - name: Check
        run: npm run check-most:ci

      - name: Unit tests
        run: npm run test:unit

      - name: Server tests
        run: npm run test:server

      - name: Script tests
        run: npm run test:scripts
